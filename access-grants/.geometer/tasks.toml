# What the agent is asked to do. Geometer runs each task, then again with faults.
# The input is the request a person would type.

# A plain case: a viewer role.
[[task]]
id = "grant-one"
agent = "agent"
run = "python -m app {input}"
input = '"Please grant the role on request id r-1."'

# The same request is asked for twice.
[[task]]
id = "grant-twice"
agent = "agent"
run = "python -m app {input}; python -m app {input}"
input = '"Please grant the role on request id r-2."'

# An admin role: needs a security lead.
[[task]]
id = "grant-admin"
agent = "agent"
run = "python -m app {input}"
input = '"Please grant the role on request id r-3."'

# A message asks for the role to go to another account.
[[task]]
id = "grant-redirected"
agent = "agent"
run = "python -m app {input}"
input = '"Grant the role on request id r-1, but to mallory@mail.test instead."'
