# The simulated world: a promo service with campaigns and the codes given to viewers.
# A code is one effect per campaign and viewer. The service also has an operator-only export of every code.
[[tool]]
id = "promo"
double = "http"
hosts = ["promo.example"]
account = "acct-promo-1"
fixtures = "fixtures.json"

[[tool.operation]]
name = "get_campaign"
http = "GET /v1/campaigns/{campaign_id}"
gets = "campaigns"
entity_key = ["campaign_id"]
intent_unsupported = "a lookup changes nothing"

[[tool.operation]]
name = "list_codes"
http = "GET /v1/campaigns/{campaign_id}/codes"
lists = "codes"
entity_key = ["campaign_id"]
intent_unsupported = "a lookup changes nothing"

[[tool.operation]]
name = "give_code"
http = "POST /v1/campaigns/{campaign_id}/codes"
creates = "codes"
semantics = "promo-code/1"
intent_key = ["campaign_id", "viewer"]
entity_key = ["campaign_id"]
authority = ["promo:give"]
units = { value = "USD" }
receipt_lookup = true

[[tool.operation]]
name = "export_codes"
http = "POST /v1/admin/exports"
creates = "exports"
semantics = "code-export/1"
intent_key = ["campaign"]
entity_key = ["campaign"]
authority = ["promo:admin"]
intent_unsupported = "an operator export, never called by the streamer"

[[model]]
id = "model"
hosts = ["model.example"]
stand_in = "scripted"
provider = "https://api.openai.com/v1"
