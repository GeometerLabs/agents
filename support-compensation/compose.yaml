# The support compensation agent. It reaches its model and the helpdesk service by hostname;
# Geometer answers those names with a scripted model and a simulated helpdesk.
services:
  agent:
    build: ./agent
    environment:
      MODEL_URL: http://model.example/v1
      HELPDESK_URL: http://helpdesk.example
      OPENAI_API_KEY: sk-test-support-compensation
      REFUND_LIMIT: "100.00"
    command: ["sleep", "infinity"]
