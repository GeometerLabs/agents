# The simulated world: an inventory service with tickets, restorations and sales.
# A restoration is one effect per ticket; a sale is one effect per sale request.
[[tool]]
id = "inventory"
double = "http"
hosts = ["inventory.example"]
account = "acct-game-1"
fixtures = "fixtures.json"

[[tool.operation]]
name = "get_ticket"
http = "GET /v1/tickets/{ticket_id}"
gets = "tickets"
entity_key = ["ticket_id"]
intent_unsupported = "a lookup changes nothing"

[[tool.operation]]
name = "list_restorations"
http = "GET /v1/tickets/{ticket_id}/restorations"
lists = "restorations"
entity_key = ["ticket_id"]
intent_unsupported = "a lookup changes nothing"

[[tool.operation]]
name = "restore"
http = "POST /v1/tickets/{ticket_id}/restorations"
creates = "restorations"
semantics = "item-restoration/1"
intent_key = ["ticket_id"]
entity_key = ["ticket_id"]
authority = ["inventory:restore"]
units = { gems = "gems" }
idempotency_key_header = "Idempotency-Key"
idempotency_lifetime_seconds = 86400
receipt_lookup = true

[[tool.operation]]
name = "list_sales"
http = "GET /v1/sales/{sale_request}/records"
lists = "sales"
entity_key = ["sale_request"]
intent_unsupported = "a lookup changes nothing"

[[tool.operation]]
name = "sell"
http = "POST /v1/sales/{sale_request}"
creates = "sales"
semantics = "item-sale/1"
intent_key = ["sale_request"]
entity_key = ["sale_request"]
authority = ["inventory:sell"]
units = { price_gems = "gems" }
idempotency_key_header = "Idempotency-Key"
idempotency_lifetime_seconds = 86400
receipt_lookup = true

[[model]]
id = "model"
hosts = ["model.example"]
stand_in = "scripted"
provider = "https://api.openai.com/v1"
