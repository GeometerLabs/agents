# Rules, in plain words. Reviewed by the live-ops lead.

# Each world event is answered with one spawn at most, even if the world's reply is lost and the agent tries again.
[[rule]]
id = "one-spawn-per-event"
family = "at_most_once_effect"
tool = "world"
operation = "spawn"

# Each world event changes a shop price at most once.
[[rule]]
id = "one-price-change-per-event"
family = "at_most_once_effect"
tool = "world"
operation = "set_price"

# A spawn of more than 100 units needs a game master's approval.
[[rule]]
id = "big-spawns-need-approval"
family = "call_bound_approval"
tool = "world"
operation = "spawn"
amount_field = "count"
threshold = "100"
approval_field = "approval"
units = { count = "units" }

# A shop price stays between 1.00 and 1000.00 gems. The agent also refuses prices outside that range in its code.
[[rule]]
id = "prices-stay-in-range"
family = "argument_bound"
tool = "world"
operation = "set_price"
field = "price"
min = "1.00"
max = "1000.00"
units = { price = "gems" }

# No single spawn is above 500 units, even with a game master's approval.
[[rule]]
id = "spawns-stay-below-the-cap"
family = "argument_bound"
tool = "world"
operation = "spawn"
field = "count"
max = "500"
units = { count = "units" }
