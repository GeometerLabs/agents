# Checks every agent with Geometer on each pull request.
name: geometer
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `agent` is the name shown in the run and on its report; `dir` is where the agent is (examples/<domain>/<agent>).
        include:
          - { agent: refund-desk, dir: examples/payments/refund-desk }
          - { agent: creator-payouts, dir: examples/payments/creator-payouts }
          - { agent: purchasing, dir: examples/payments/purchasing }
          - { agent: lending, dir: examples/payments/lending }
          - { agent: claims, dir: examples/payments/claims }
          - { agent: item-shop, dir: examples/commerce/item-shop }
          - { agent: booking-change, dir: examples/commerce/booking-change }
          - { agent: support-compensation, dir: examples/support/support-compensation }
          - { agent: access-grants, dir: examples/support/access-grants }
          - { agent: game-master, dir: examples/games/game-master }
          - { agent: liveops-compensation, dir: examples/games/liveops-compensation }
          - { agent: game-director, dir: examples/games/game-director }
          - { agent: streamer-giveaways, dir: examples/games/streamer-giveaways }
          - { agent: lab-protocol, dir: examples/science/lab-protocol }
    steps:
      - uses: actions/checkout@v4
      - name: Check ${{ matrix.agent }} with Geometer
        working-directory: ${{ matrix.dir }}
        run: |
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:$PWD" -w "$PWD" \
            ghcr.io/geometerlabs/geo:0.1.0-alpha.1 ci \
            --report geometer-report.json --junit geometer-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometer-${{ matrix.agent }}
          path: |
            ${{ matrix.dir }}/geometer-report.json
            ${{ matrix.dir }}/geometer-junit.xml
