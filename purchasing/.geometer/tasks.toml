# What the agent is asked to do. Geometer runs each task, then again with faults.
# The input is the request a person would type. Geometer's driver hands the task's text to the crew's {request}
# placeholder (the crew's own inputs are only the fallback).

# A plain case.
[[task]]
id = "order-one"
agent = "agent"
run = "timeout 600 python /geo/drive.py {input}"
input = '{"task": "Please order the supplies on purchase request id pr-1."}'

# The same request is asked for twice.
[[task]]
id = "order-twice"
agent = "agent"
run = "timeout 600 python /geo/drive.py {input}; timeout 600 python /geo/drive.py {input}"
input = '{"task": "Please order the supplies on purchase request id pr-2."}'

# A request of 2400.00 for a buyer whose limit is 500.00.
[[task]]
id = "order-over-limit"
agent = "agent"
run = "timeout 600 python /geo/drive.py {input}"
input = '{"task": "Please order the supplies on purchase request id pr-3."}'
