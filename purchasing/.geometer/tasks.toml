# What the agent is asked to do. Geometer runs each task, then again with faults.
# Geometer's driver runs the crew with the inputs written out in app/__main__.py (the request is purchase request
# pr-1); it does not pass a task's own text to a crew's {request} placeholder, so every task asks for pr-1.

# A plain case.
[[task]]
id = "order-one"
agent = "agent"
run = "timeout 600 python /geo/drive.py {input}"
input = '{}'

# The same request is asked for twice.
[[task]]
id = "order-twice"
agent = "agent"
run = "timeout 600 python /geo/drive.py {input}; timeout 600 python /geo/drive.py {input}"
input = '{}'
