# Rules, in plain words. Reviewed by the live-ops lead.

# Each world event is answered with one spawn at most, even if the world's reply is lost and the agent tries again.
[[rule]]
id = "one-spawn-per-event"
family = "at_most_once_effect"
tool = "world"
operation = "spawn"

# Each world event changes a shop price at most once.
[[rule]]
id = "one-price-change-per-event"
family = "at_most_once_effect"
tool = "world"
operation = "set_price"

# A spawn of more than 100 units needs a game master's approval.
[[rule]]
id = "big-spawns-need-approval"
family = "call_bound_approval"
tool = "world"
operation = "spawn"
amount_field = "count"
threshold = "100"
approval_field = "approval"
units = { count = "units" }

# A shop price stays between 1.00 and 1000.00 gems. The agent refuses prices outside that range in its code.
# Geometer's number-bound rule (numeric_bound) reads a stored column of a database it can observe, and
# rules.toml cannot declare it; this agent's shop is a web service, so no rule is declared here (see LIMITS.md).
